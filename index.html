<!DOCTYPE html>
<html lang="en">
<head>

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'G-3Q55H62E60');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f0ebe3">
  <title>Pillsette — Never forget to take your medication again</title>
  <meta property="og:site_name" content="Pillsette | Seamless medication management" />
  <meta property="og:image" content="pillsette-logo.svg" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
      background-color: #fbf6e3;
      color: #dd5228;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100svh;
      padding: 2.5rem 1.5rem;
    }

    header {
      flex-shrink: 0;
    }

    .logo {
      height: 13.5rem;
      width: auto;
      display: block;
    }

    .cta-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
      width: 100%;
      max-width: 28rem;
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 600;
      line-height: 1.2;
      color: #dd5228;
      text-wrap: balance;
    }

    .subtitle {
      font-size: 1rem;
      line-height: 1.6;
      color: #545454;
      text-wrap: pretty;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: #f88701;
      color: #f5fafa;
      padding: 1rem 2rem;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .cta-button:hover {
      opacity: 0.9;
    }

    .cta-button svg {
      width: 1rem;
      height: 1rem;
      transition: transform 0.2s ease;
    }

    .cta-button:hover svg {
      transform: translateX(4px);
    }

    footer {
      margin-top: auto;
      padding-top: 5rem;
      font-size: 0.875rem;
      color: #4d7a85;
    }

    @media (min-width: 768px) {
      main {
        padding: 4rem 1.5rem;
      }

      .logo {
        height: 16rem;
      }

      h1 {
        font-size: 2.25rem;
      }
    }
  </style>

<body>
  <main>
    <header>
      <img
        src="pillsette-logo.svg"
        alt="Pillsette"
        class="logo"
      >
    </header>

    <div class="cta-section">
      <h1>Struggling to keep track of your pills?</h1>

      <p class="subtitle">You're not alone. Tell us about your experience — we're building something to help.</p>

      <a
        href="https://uoft.me/medpackaging"
        target="_blank"
        rel="noopener noreferrer"
        class="cta-button"
      >
        Share your experience
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>

    <footer>
      &copy; <script>document.write(new Date().getFullYear())</script> Pillsette
    </footer>
  </main>
</body>
</html>
